# =============================================================================
# Docker Compose — self-hosted monitoring stack for Tavro (dev company side)
#
# Brings up, all free/open-source:
#   - Uptime Kuma        : uptime monitors + notifications (email/Slack/Telegram)
#   - GlitchTip          : Sentry-compatible ERROR TRACKING (drop-in for the SDK)
#   - Prometheus         : time-series (metrics) scraper
#   - node_exporter      : OS metrics (CPU/RAM/disk) on the host
#   - Grafana            : dashboards over Prometheus
#
# Usage (on the monitoring VPS / Docker host):
#   docker compose -f ops/monitoring/docker-compose.monitoring.yml up -d
#
# Store secrets in a sibling .monitoring.env, e.g.:
#   GRAFANA_ADMIN_PASSWORD=..., GLITCHTIP_SECRET_KEY=...
# =============================================================================

services:
  # ---- PostgreSQL (for GlitchTip) -------------------------------------------
  glitchtip-db:
    image: postgres:16-alpine
    container_name: monitoring-glitchtip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis (for GlitchTip) -------------------------------------------------
  glitchtip-redis:
    image: redis:7-alpine
    container_name: monitoring-glitchtip-redis
    restart: unless-stopped

  # ---- Sentry-compatible error tracking (drop-in for sentry/sentry-laravel) --
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: monitoring-glitchtip
    restart: unless-stopped
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    ports:
      - "${GLITCHTIP_PORT:-3002}:8080"     # web UI / event ingestion
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      CELERY_BROKER_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-CHANGE_ME_a_long_random_string}
      EMAIL_ENABLED: "true"
      PORT: "8080"
    volumes:
      - glitchtip_uploads:/code/uploads

  # ---- Uptime + alerting ----------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: monitoring-uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data

  # ---- Metrics --------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-3003}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  glitchtip_db_data:
  glitchtip_uploads:
  uptime_kuma_data:
  prometheus_data:
  grafana_data:
